<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tab Guard</title>
<link rel="stylesheet" href="../assets/fonts.css">
<style>h1,h2,h3,h4{text-wrap:balance}p,li,label,.note,.small{text-wrap:pretty}
  body { margin: 0; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center;
    padding: clamp(20px, 6vh, 64px) 16px 40px; font-size: 15.5px; line-height: 1.55;
    background: radial-gradient(1200px 600px at 50% -10%, #1a2233, var(--bg) 70%); }
  .wrap { width: min(100%, 640px); }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px; }
  .brand { font-weight: 700; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
  .brand img { width: 26px; height: 26px; }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 26px; height: 5px; border-radius: 99px; background: var(--line-2); transition: background .2s; }
  .dots i.on { background: var(--accent); }
  .step { display: none; }
  .step.on { display: block; animation: in .25s ease; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .step.on { animation: none; } }
  h1 { font-size: clamp(25px, 4.4vw, 32px); line-height: 1.2; letter-spacing: -.02em; margin: 0 0 10px; }
  .lead { color: var(--muted); margin: 0 0 24px; font-size: 16px; }
  .items { display: grid; gap: 12px; margin: 0 0 18px; }
  .item { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
  .item .ic { font-size: 20px; line-height: 24px; height: 24px; flex: none; }
  .item b { display: block; line-height: 24px; }
  .item span { color: var(--muted); font-size: 14px; }
  .card { padding: 16px 18px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); margin: 0 0 14px; }
  .card h2 { font-size: 16.5px; margin: 0 0 4px; display: flex; gap: 10px; align-items: flex-start; line-height: 24px; }
  .card h2 .ic { height: 24px; display: inline-flex; align-items: center; flex: none; }
  .card p { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font: inherit; font-size: 13.5px; padding: 7px 12px; border-radius: 99px; cursor: pointer;
    border: 1px solid var(--line-2); background: var(--panel-2); color: var(--muted); }
  .chip[aria-pressed="true"] { border-color: var(--accent); color: var(--ink); background: rgba(111,157,255,.14); }
  .chip[aria-pressed="true"]::before { content: "✓ "; color: var(--accent); }
  .add { display: flex; gap: 8px; margin-top: 10px; }
  .add input { flex: 1 1 auto; min-width: 0; font: inherit; font-size: 14px; padding: 9px 12px; border-radius: 10px;
    background: var(--panel-2); border: 1px solid var(--line-2); color: var(--ink); }
  .add input:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .row label { font-weight: 700; }
  .sw { position: relative; width: 46px; height: 26px; flex: 0 0 auto; }
  .sw input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1; }
  .sw span { position: absolute; inset: 0; background: #1a1f2c; border: 1.5px solid #3a4256; border-radius: 99px; transition: .18s; }
  .sw span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; background: #8b93a7; border-radius: 50%; transition: .18s; }
  .sw input:checked + span { background: rgba(111,157,255,.28); border-color: var(--accent); }
  .sw input:checked + span::after { transform: translateX(20px); background: var(--accent); }
  select { font: inherit; font-size: 14px; padding: 7px 10px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line-2); color: var(--ink); }
  .nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; }
  .btn { font: inherit; font-weight: 700; font-size: 15px; padding: 12px 22px; border-radius: 12px; border: 0; cursor: pointer; text-decoration: none; text-align: center; }
  .primary { background: var(--accent); color: #06122e; }
  .ghost { background: transparent; color: var(--muted); border: 1px solid var(--line-2); }
  .ghost[hidden] { visibility: hidden; display: inline-block; }
  .small { color: var(--faint); font-size: 13px; margin-top: 14px; }
  .later { color: var(--faint); font-size: 13px; margin: 6px 0 0; }
  @media (max-width: 480px) { .nav { flex-direction: column-reverse; } .nav .btn { width: 100%; } .ghost[hidden] { display: none; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand"><img src="../assets/icon128.png" alt=""> Tab Guard</div>
      <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
    </div>

    <section class="step" data-step="0">
      <h1 data-i18n="w_h1">Browse on purpose, not on autopilot.</h1>
      <p class="lead" data-i18n="w_lead"></p>
      <div class="items">
        <div class="item"><span class="ic">🧭</span><div><b data-i18n="w_i1t"></b><span data-i18n="w_i1"></span></div></div>
        <div class="item"><span class="ic">🌫️</span><div><b data-i18n="w_i2t"></b><span data-i18n="w_i2"></span></div></div>
        <div class="item"><span class="ic">🔒</span><div><b data-i18n="w_i3t"></b><span data-i18n="w_i3"></span></div></div>
      </div>
      <p class="small" data-i18n="w_private"></p>
    </section>

    <section class="step" data-step="1">
      <h1 data-i18n="w_h2"></h1>
      <p class="lead" data-i18n="w_lead2"></p>
      <div class="card">
        <h2><span class="ic">✅</span><span data-i18n="o_h_trusted"></span></h2>
        <p data-i18n="w_trusted"></p>
        <div class="chips" id="trusted"></div>
        <div class="add"><input id="trustedAdd" data-i18n-ph="w_addPh" placeholder="example.com"><button class="btn ghost" type="button" id="trustedBtn" data-i18n="w_add">Add</button></div>
      </div>
      <div class="card">
        <h2><span class="ic">🎬</span><span data-i18n="o_h_streaming"></span></h2>
        <p data-i18n="w_streaming"></p>
        <div class="chips" id="streaming"></div>
      </div>
    </section>

    <section class="step" data-step="2">
      <h1 data-i18n="w_h3"></h1>
      <p class="lead" data-i18n="w_lead3"></p>
      <div class="card">
        <div class="row"><h2><span class="ic">🔞</span><span data-i18n="o_h_jug"></span></h2><label class="sw"><input type="checkbox" id="adult"><span></span></label></div>
        <p data-i18n="w_adult" style="margin:0"></p>
      </div>
      <div class="card">
        <h2><span class="ic">⏳</span><span data-i18n="o_h_waitroom"></span></h2>
        <p data-i18n="w_wait"></p>
        <div class="chips" id="wait"></div>
        <div class="add"><input id="waitAdd" data-i18n-ph="w_addPh" placeholder="example.com"><button class="btn ghost" type="button" id="waitBtn" data-i18n="w_add">Add</button></div>
        <div class="row" style="margin-top:12px"><span data-i18n="o_l_wrSec" style="color:var(--muted);font-size:14px"></span>
          <select id="waitSec"><option value="10">10 s</option><option value="20" selected>20 s</option><option value="30">30 s</option><option value="60">60 s</option></select></div>
      </div>
    </section>

    <section class="step" data-step="3">
      <h1 data-i18n="w_h4"></h1>
      <p class="lead" data-i18n="w_lead4"></p>
      <div class="card">
        <h2><span class="ic">🔒</span><span data-i18n="o_h_lock"></span></h2>
        <p data-i18n="w_lock"></p>
        <a class="btn ghost" id="lockLink" href="../options/options.html#s_o_h_lock" data-i18n="w_lockBtn" style="display:inline-block">Set up the lock</a>
      </div>
      <div class="card">
        <h2><span class="ic">⚙️</span><span data-i18n="w_moreT"></span></h2>
        <p data-i18n="w_more" style="margin:0"></p>
      </div>
      <p class="later" id="laterNote" data-i18n="w_later" style="display:none"></p>
    </section>

    <div class="nav">
      <button class="btn ghost" type="button" id="back" data-i18n="w_back">Back</button>
      <button class="btn primary" type="button" id="next" data-i18n="w_next">Next</button>
    </div>
  </div>
  <script src="welcome.js" type="module"></script>
</body>
</html>
