name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        env:
          GECKO_ID: ${{ secrets.GECKO_ID }}
        run: scripts/build.sh
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Tab Guard $GITHUB_REF_NAME" --notes "See CHANGELOG.md for what changed."
