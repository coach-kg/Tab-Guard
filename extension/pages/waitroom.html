<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tab Guard</title>
<link rel="stylesheet" href="../assets/fonts.css">
<style>h1,h2,h3,h4{text-wrap:balance}p,li,label,.note,.small{text-wrap:pretty}
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
    font: 16px/1.55 "Atkinson", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: radial-gradient(1100px 620px at 50% -12%, #2a2140, #0d0b14 70%); color: #efeaf6; }
  .card { width: min(100%, 460px); text-align: center; }
  .breath { position: relative; width: 168px; height: 168px; margin: 0 auto 26px; }
  .breath .halo { position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle, rgba(196,170,255,.42), rgba(196,170,255,.06) 62%, transparent 70%);
    animation: breathe 8s ease-in-out infinite; }
  .breath .core { position: absolute; inset: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: #1b1528; border: 1px solid rgba(196,170,255,.35); font-variant-numeric: tabular-nums;
    font-size: 30px; font-weight: 700; color: #e6dbff; }
  @keyframes breathe { 0%, 100% { transform: scale(.72); opacity: .55; } 50% { transform: scale(1.06); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .breath .halo { animation: none; transform: scale(.9); } }
  .cue { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #a99cc4; min-height: 20px; margin: -10px 0 18px; }
  h1 { font-size: 24px; line-height: 1.3; margin: 0 0 6px; font-weight: 700; }
  h1 b { color: #d9c8ff; }
  .sub { color: #a99cc4; margin: 0 0 22px; font-size: 14.5px; }
  label.q { display: block; text-align: left; font-weight: 700; margin: 0 0 8px; font-size: 15px; }
  input { width: 100%; font: inherit; font-size: 15px; padding: 12px 14px; border-radius: 12px; color: #efeaf6;
    background: #171222; border: 1px solid #3a2f52; outline: none; }
  input:focus { border-color: #b69bff; }
  .row { display: flex; gap: 10px; margin-top: 16px; }
  button { flex: 1 1 0; font: inherit; font-weight: 700; font-size: 15px; padding: 12px 16px; border-radius: 12px; border: 0; cursor: pointer; }
  #open { background: #b69bff; color: #1a1030; }
  #open:disabled { background: #2a2340; color: #8c80a8; cursor: default; }
  #back { background: transparent; color: #cbbfe3; border: 1px solid #3a2f52; }
  .note { color: #7f7498; font-size: 12.5px; margin-top: 16px; }
  @media (max-width: 420px) { .row { flex-direction: column-reverse; } h1 { font-size: 21px; } .breath { width: 140px; height: 140px; } .breath .core { inset: 36px; } }
</style>
</head>
<body>
  <main class="card">
    <div class="breath" aria-hidden="true"><div class="halo"></div><div class="core" id="count">20</div></div>
    <div class="cue" id="cue"></div>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
    <label class="q" for="why" id="q"></label>
    <input id="why" type="text" autocomplete="off" maxlength="140">
    <div class="row">
      <button type="button" id="back"></button>
      <button type="button" id="open" disabled></button>
    </div>
    <p class="note" id="note"></p>
  </main>
  <script src="waitroom.js" type="module"></script>
</body>
</html>
