<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../assets/fonts.css">
<style>h1,h2,h3,h4{text-wrap:balance}p,li,label,.note,.small{text-wrap:pretty}
  body { width: 300px; margin: 0; }
  .hd { display: flex; align-items: baseline; justify-content: space-between; padding: 16px 18px 10px; }
  .hd h1 { font-size: 17px; font-weight: 700; letter-spacing: -.02em; margin: 0; }
  .hd .st { font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .body { padding: 4px 18px 16px; }

  .gauge { margin: 6px 0 14px; }
  .gauge .bar { height: 7px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .gauge .fill { height: 100%; width: 0%; border-radius: 99px; transition: width .5s, background .5s; }
  .gauge .cap { display: flex; justify-content: space-between; margin-top: 6px; font-family: var(--mono); font-size: 10.5px; color: var(--faint); }

  .row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .row .k { color: var(--muted); font-size: 13.5px; display: flex; align-items: flex-start; gap: 8px; line-height: 19px; }
  .row .ic { font-family: var(--mono); color: var(--faint); font-size: 12px; flex: none; height: 19px; display: inline-flex; align-items: center; }
  .row .v { font-family: var(--mono); font-size: 13px; }

  .badge { font-family: var(--mono); padding: 2px 9px; border-radius: 99px; font-size: 11.5px; }
  .b-known { background: #10281a; color: var(--ok); }
  .b-watch { background: #3b2f10; color: var(--warn); }
  .b-lock  { background: #3a1420; color: var(--bad); }

  .actions { margin-top: 14px; display: grid; gap: 8px; }
  .bchoice { display: grid; gap: 6px; }
  .bchoice .bq { font-size: 12.5px; color: var(--muted); }
  .bseg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .bseg button { font-size: 12.5px; padding: 8px 4px; }
  button { font-family: inherit; font-size: 14px; font-weight: 700; padding: 10px; border: 1px solid var(--line-2);
    border-radius: 11px; cursor: pointer; background: var(--panel); color: var(--ink); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #06122e; }
  button.ghost { background: transparent; color: var(--muted); }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .55; cursor: default; border-color: var(--line-2); }


  .view { margin-top: 12px; }
  .view .vh { font-size: 12px; color: var(--faint); margin-bottom: 6px; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 3px; border-radius: 11px; background: var(--panel); border: 1px solid var(--line-2); }
  .seg button { font-size: 12.5px; font-weight: 600; padding: 6px 4px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-checked="true"] { background: var(--panel-2); color: var(--ink); box-shadow: 0 0 0 1px var(--line-2); }
  .vhere { display: flex; align-items: center; gap: 7px; margin-top: 7px; font-size: 12px; color: var(--muted); cursor: pointer; }
  .vhere input { margin: 0; accent-color: var(--accent); }
  .vnote { margin: 5px 0 0; font-size: 11px; color: var(--faint); }

  .foot { margin-top: 12px; font-size: 11px; line-height: 1.5; color: var(--faint); }
</style>
</head>
<body>
  <div class="hd"><h1>Tab&nbsp;Guard</h1><span class="st" id="state">● on</span></div>
  <div class="body">
    <div class="gauge">
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="cap"><span id="stageLbl">calm</span><span id="pval">0</span></div>
    </div>

    <div class="row"><span class="k"><span class="ic">🌐</span><span data-i18n="thisSite">this site</span></span><span class="badge b-known" id="site">—</span></div>
    <div class="row"><span class="k"><span class="ic">🌀</span><span data-i18n="scrollIntensity">scroll intensity</span></span><span class="v" id="score">0</span></div>
    <div class="row"><span class="k"><span class="ic">⏱️</span><span data-i18n="activeHere">active here</span></span><span class="v" id="mins">0.0m</span></div>
    <div class="row" id="pgRow" style="display:none;cursor:default"><span class="k"><span class="ic">📄</span><span data-i18n="pg_row">feed</span></span><span class="v" id="pgState" style="font-size:12px;text-align:right">—</span></div>
    <div class="row" id="lockRow" style="display:none"><span class="k"><span class="ic">🔒</span><span data-i18n="lockedRow">locked</span></span><span class="v" id="lockLeft">—</span></div>

    <div class="view" id="viewBox">
      <div class="vh" data-i18n="view_lbl">View</div>
      <div class="seg" role="radiogroup">
        <button type="button" role="radio" data-mode="normal" data-i18n="view_normal">Normal</button>
        <button type="button" role="radio" data-mode="grey" data-i18n="view_grey">Grey</button>
        <button type="button" role="radio" data-mode="blur" data-i18n="view_blur">Blurred</button>
      </div>
      <label class="vhere" id="viewHereRow" style="display:none"><input type="checkbox" id="viewHere"><span data-i18n="view_here">Always normal on this site</span></label>
      <p class="vnote" id="viewNote" style="display:none" data-i18n="view_note"></p>
    </div>

    <div class="actions">
      <button id="unlock" style="display:none" data-i18n="unlockDomain">unlock this domain</button>
      <button id="block" data-i18n="blockSite">block this site</button>
      <div class="bchoice" id="blockChoice" style="display:none">
        <span class="bq" data-i18n="pp_blockAsk">For how long?</span>
        <div class="bseg"><button type="button" data-for="hour" data-i18n="pp_block1h">1 hour</button><button type="button" data-for="day" id="blockDay">until tomorrow</button><button type="button" data-for="ever" data-i18n="pp_blockEver">for good</button></div>
      </div>
      <button class="ghost" id="cool" data-i18n="resetPressure">reset pressure</button>
      <button class="primary" id="toggle">pause protection…</button>
      <button class="ghost" id="opts" data-i18n="settings">settings</button>
    </div>
    <p class="foot" id="exitNote" style="display:none"></p>
  </div>

  <div id="pgate" style="display:none">
    <div class="pg-card">
      <div class="pg-ic">🔒</div>
      <div class="pg-t" data-i18n="pg_type">Type to unlock</div>
      <div class="pg-code mono" id="pgChallenge"></div>
      <input type="text" id="pgPass" data-i18n-ph="pg_ph" placeholder="type the code">
      <div class="pg-err" id="pgErr"></div>
      <button id="pgOk" data-i18n="pg_ok">unlock</button>
      <button class="ghost" id="pgCancel" data-i18n="pg_cancel">cancel</button>
    </div>
  </div>

  <style>h1,h2,h3,h4{text-wrap:balance}p,li,label,.note,.small{text-wrap:pretty}
    #pgate { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
      background: rgba(8,10,15,.9); backdrop-filter: blur(8px); }
    .pg-card { width: 220px; text-align: center; padding: 18px; }
    .pg-ic { font-size: 26px; }
    .pg-t { font-weight: 700; margin: 4px 0 10px; }
    .pg-card input { width: 100%; text-align: center; font-family: var(--mono); letter-spacing: .1em; font-size: 14px;
      padding: 9px; margin-bottom: 8px; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 9px; color: var(--ink); }
    .pg-code { font-size: 15px; letter-spacing: .14em; padding: 8px; margin-bottom: 8px; user-select: none;
      background: var(--panel-2); border: 1px dashed var(--accent); border-radius: 8px; color: var(--accent); }
    .pg-err { color: var(--bad); font-size: 11.5px; min-height: 14px; margin-bottom: 6px; }
    .pg-card button { width: 100%; margin-top: 6px; }
  </style>

  <script src="../assets/lock.js"></script>
  <script src="popup.js" type="module"></script>
</body>
</html>
